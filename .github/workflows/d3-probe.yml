name: D3 probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Save sample schedule and box score pages
        run: |
          mkdir probe && cd probe
          UA="Mozilla/5.0 (compatible; Turnstile attendance tracker)"
          for site in athletics.hope.edu trinethunder.com www.iwusports.com calvinknights.com athletics.mountunion.edu; do
            curl -sSL -A "$UA" -o "$site-schedule.html" -w "$site schedule %{http_code} %{size_download}\n" "https://$site/sports/mens-basketball/schedule/2026-27" || true
            link=$(grep -oE "/sports/mens-basketball/stats/2026-27/[^\"' ]+/boxscore/[0-9]+" "$site-schedule.html" | head -1)
            echo "$site first box score: $link"
            [ -n "$link" ] && curl -sSL -A "$UA" -o "$site-box.html" -w "$site box %{http_code} %{size_download}\n" "https://$site$link" || true
          done
          ls -la
      - name: Push samples to a scratch branch
        run: |
          cd probe && git init -q -b d3-probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "probe samples"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" d3-probe
